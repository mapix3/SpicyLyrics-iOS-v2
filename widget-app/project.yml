name: SpicyLyricsWidget
options:
  bundleIdPrefix: com.spotify.client
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_BITCODE: "NO"
targets:
  SpicyLyricsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.spotify.client.spicylyricswidget
        PRODUCT_NAME: SpicyLyricsWidget
        INFOPLIST_FILE: Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Widget/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: "YES"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Spicy Lyrics
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/Widget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.spotify.client.widget]
