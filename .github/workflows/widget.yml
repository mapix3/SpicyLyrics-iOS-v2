name: Widget

on:
  push:
    paths: ["widget-app/**", ".github/workflows/widget.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Generate project
        working-directory: widget-app
        run: xcodegen generate

      - name: Build
        working-directory: widget-app
        run: |
          set -o pipefail
          xcodebuild -project SpicyLyricsWidget.xcodeproj -target SpicyLyricsWidget -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -80

      - name: Package
        working-directory: widget-app
        run: |
          APPEX=build/Release-iphoneos/SpicyLyricsWidget.appex
          ls -la "$APPEX"
          ldid -SWidget/Widget.entitlements "$APPEX/SpicyLyricsWidget"
          mkdir -p out && cp -R "$APPEX" out/
          (cd out && zip -qry ../SpicyLyricsWidget.appex.zip SpicyLyricsWidget.appex)

      - uses: actions/upload-artifact@v4
        with:
          name: SpicyLyricsWidget-appex
          path: widget-app/SpicyLyricsWidget.appex.zip
