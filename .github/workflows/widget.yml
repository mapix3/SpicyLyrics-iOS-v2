name: Widget App

on:
  push:
    paths: ["widget-app/**", ".github/workflows/widget.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ldid

      - name: Spicy API key
        env:
          SPICY_API_KEY: ${{ secrets.SPICY_API_KEY }}
        run: |
          if [ -n "$SPICY_API_KEY" ]; then
            printf 'enum Secrets {\n    static let spicyAPIKey = "%s"\n}\n' "$SPICY_API_KEY" > widget-app/Shared/Secrets.swift
          fi

      - name: Generate project
        working-directory: widget-app
        run: xcodegen generate

      - name: Build
        working-directory: widget-app
        run: |
          set -o pipefail
          xcodebuild -project LyricsWidget.xcodeproj -scheme LyricsWidget -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -60

      - name: Package IPA
        working-directory: widget-app
        run: |
          APP=build/Build/Products/Release-iphoneos/LyricsWidget.app
          ls -la "$APP" "$APP/PlugIns"
          # ad-hoc подпись с entitlements: SideStore/AltStore/Sideloadly берут из неё App Group
          ldid -SWidget/Widget.entitlements "$APP/PlugIns/LyricsWidgetExtension.appex/LyricsWidgetExtension"
          ldid -SApp/App.entitlements "$APP/LyricsWidget"
          ldid -e "$APP/LyricsWidget"
          mkdir -p out/Payload && cp -R "$APP" out/Payload/
          (cd out && zip -qry ../LyricsWidget.ipa Payload)
          ls -la LyricsWidget.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: LyricsWidget-ipa
          path: widget-app/LyricsWidget.ipa
